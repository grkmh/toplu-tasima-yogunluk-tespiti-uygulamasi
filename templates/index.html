<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaRadar</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f3f5f8; color: #17202a; }
        header { background: #173b57; color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; }
        header button { width: auto; margin: 0; padding: 8px 14px; background: #fff; color: #173b57; }
        main { width: min(1050px, 94%); margin: 24px auto; display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
        .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.07); margin-bottom: 20px; }
        .istatistikler { grid-column: 1 / -1; }
        .istatistik-aciklama { color: #5c6873; margin-top: -8px; }
        .bar-satiri { display: grid; grid-template-columns: 90px 1fr 145px; gap: 12px; align-items: center; margin-top: 14px; }
        .bar-hat { font-weight: 750; overflow-wrap: anywhere; }
        .bar-zemin { height: 28px; background: #edf0f2; border-radius: 7px; overflow: hidden; }
        .bar-dolgu { height: 100%; min-width: 3px; border-radius: 7px; transition: width .35s ease; }
        .bar-deger { color: #45515c; font-size: 14px; text-align: right; }
        h2 { margin-top: 0; font-size: 20px; }
        label { display: block; font-weight: 650; margin-top: 12px; }
        input, select, textarea, button { width: 100%; padding: 11px; border: 1px solid #cdd4dc; border-radius: 8px; margin-top: 6px; font: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        button { border: 0; background: #16835f; color: white; font-weight: 700; cursor: pointer; margin-top: 16px; }
        button.danger { background: #c64545; }
        .hidden { display: none; }
        .mesaj { padding: 10px; border-radius: 8px; margin-top: 12px; }
        .basarili { background: #def5e8; color: #12623f; }
        .hatali { background: #fde4e4; color: #8b2020; }
        .paylasim { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid #e6e9ed; }
        .paylasim:last-child { border: 0; margin-bottom: 0; }
        .paylasim img { width: 100%; max-height: 480px; object-fit: cover; border-radius: 10px; background: #eee; }
        .meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 9px; color: #52616d; font-size: 14px; }
        .meta strong { color: #17202a; }
        .aciklama { white-space: pre-wrap; }
        .bos { color: #667; text-align: center; padding: 28px 0; }
        @media (max-width: 760px) {
            main { grid-template-columns: 1fr; }
            .bar-satiri { grid-template-columns: 65px 1fr; }
            .bar-deger { grid-column: 2; text-align: left; }
        }
    </style>
</head>
<body>
<header>
    <div><h1>RotaRadar</h1><small id="kullaniciAdi"></small></div>
    <button onclick="cikisYap()">Çıkış yap</button>
</header>

<main>
    <section class="card istatistikler">
        <h2>Hatların ortalama yoğunluğu</h2>
        <p class="istatistik-aciklama">Tamamlanmış tüm yolculukların biniş ve iniş yoğunluğu ortalamasına göre hesaplanır.</p>
        <div id="yogunlukGrafigi"><p class="bos">Yükleniyor...</p></div>
    </section>

    <section>
        <div class="card" id="baslaEkrani">
            <h2>Yolculuğa başla</h2>
            <label for="hatKodu">Hat kodu</label>
            <input id="hatKodu" maxlength="20" placeholder="Örn: 522ST">
            <label for="durakAdi">Biniş durağı</label>
            <input id="durakAdi" maxlength="100" placeholder="Örn: Kadıköy">
            <label for="yogunlukSkoru">Yoğunluk</label>
            <select id="yogunlukSkoru"><option value="2">Rahat</option><option value="5">Orta</option><option value="8">Çok yoğun</option><option value="9">Aşırı yoğun</option></select>
            <button onclick="yolculukBaslat()">Yolculuğa başla</button>
            <div id="mesajBasla" class="mesaj hidden"></div>
        </div>

        <div class="card hidden" id="bitirEkrani">
            <h2>Aktif yolculuk</h2>
            <p id="aktifYolculuk"></p>
            <label for="inisDuragi">İniş durağı</label>
            <input id="inisDuragi" maxlength="100" placeholder="Örn: Pendik">
            <label for="inisYogunlukSkoru">İnerken yoğunluk</label>
            <select id="inisYogunlukSkoru"><option value="2">Rahat</option><option value="5">Orta</option><option value="8">Çok yoğun</option><option value="9">Aşırı yoğun</option></select>
            <button class="danger" onclick="yolculukBitir()">Yolculuğu bitir</button>
            <div id="mesajBitir" class="mesaj hidden"></div>
        </div>

        <div class="card">
            <h2>Fotoğraf paylaş</h2>
            <form id="paylasimFormu">
                <label for="paylasimHat">Hat kodu</label>
                <input id="paylasimHat" name="hat_kodu" maxlength="20" required placeholder="Örn: 522ST">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" maxlength="280" placeholder="Araç ve yolculuk hakkında kısa bilgi"></textarea>
                <label for="fotograf">Fotoğraf (JPG, PNG veya WebP; en fazla 5 MB)</label>
                <input id="fotograf" name="fotograf" type="file" accept="image/jpeg,image/png,image/webp" required>
                <button type="submit">Paylaş</button>
                <div id="mesajPaylasim" class="mesaj hidden"></div>
            </form>
        </div>
    </section>

    <section class="card">
        <h2>Son paylaşımlar</h2>
        <div id="paylasimlar"><p class="bos">Yükleniyor...</p></div>
    </section>
</main>

<script>
    const token = localStorage.getItem("rotaToken");
    if (!token) window.location.replace("/");

    function mesajGoster(id, mesaj, hata = false) {
        const kutu = document.getElementById(id);
        kutu.textContent = mesaj;
        kutu.className = `mesaj ${hata ? "hatali" : "basarili"}`;
    }

    function cikisYap() {
        localStorage.removeItem("rotaToken");
        localStorage.removeItem("rotaKullaniciAdi");
        window.location.replace("/");
    }

    async function api(endpoint, ayarlar = {}) {
        const headers = new Headers(ayarlar.headers || {});
        headers.set("Authorization", `Bearer ${token}`);
        if (ayarlar.body && !(ayarlar.body instanceof FormData)) headers.set("Content-Type", "application/json");
        const response = await fetch(endpoint, { ...ayarlar, headers });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) { cikisYap(); throw new Error("Oturum süresi doldu."); }
        if (!response.ok) throw new Error(data.detail || "İşlem gerçekleştirilemedi.");
        return data;
    }

    async function yolculukBaslat() {
        const payload = {
            hat_kodu: document.getElementById("hatKodu").value.trim(),
            durak_adi: document.getElementById("durakAdi").value.trim(),
            yogunluk_skoru: Number(document.getElementById("yogunlukSkoru").value)
        };
        if (!payload.hat_kodu || !payload.durak_adi) return mesajGoster("mesajBasla", "Tüm alanları doldurun.", true);
        try { await api("/api/yolculuk/basla", { method: "POST", body: JSON.stringify(payload) }); await aktifYolculuguYukle(); }
        catch (error) { mesajGoster("mesajBasla", error.message, true); }
    }

    async function yolculukBitir() {
        const durak = document.getElementById("inisDuragi").value.trim();
        if (!durak) return mesajGoster("mesajBitir", "İniş durağını girin.", true);
        try {
            await api("/api/yolculuk/bitir", { method: "POST", body: JSON.stringify({ durak_adi: durak, yogunluk_skoru: Number(document.getElementById("inisYogunlukSkoru").value) }) });
            document.getElementById("inisDuragi").value = "";
            await aktifYolculuguYukle();
            await yogunlukGrafiginiYukle();
            mesajGoster("mesajBasla", "Yolculuk kaydedildi.");
        } catch (error) { mesajGoster("mesajBitir", error.message, true); }
    }

    async function aktifYolculuguYukle() {
        const durum = await api("/api/yolculuk/aktif");
        document.getElementById("baslaEkrani").classList.toggle("hidden", durum.aktif);
        document.getElementById("bitirEkrani").classList.toggle("hidden", !durum.aktif);
        if (durum.aktif) document.getElementById("aktifYolculuk").textContent = `${durum.hat_kodu} hattı - ${durum.binis_duragi}`;
    }

    function guvenliMetin(metin) {
        const span = document.createElement("span");
        span.textContent = metin || "";
        return span.innerHTML;
    }

    function yogunlukRengi(puan) {
        if (puan <= 3) return "#27ae60";
        if (puan <= 6) return "#e3b341";
        if (puan <= 8) return "#e67e22";
        return "#c0392b";
    }

    function yogunlukEtiketi(puan) {
        if (puan <= 3) return "Rahat";
        if (puan <= 6) return "Orta";
        if (puan <= 8) return "Yoğun";
        return "Aşırı yoğun";
    }

    async function yogunlukGrafiginiYukle() {
        const veriler = await api("/api/istatistikler/hat-yogunluklari");
        const alan = document.getElementById("yogunlukGrafigi");
        if (!veriler.length) {
            alan.innerHTML = '<p class="bos">Grafik için henüz tamamlanmış yolculuk yok.</p>';
            return;
        }
        alan.innerHTML = veriler.map(veri => {
            const puan = Number(veri.ortalama_yogunluk);
            const genislik = Math.max(0, Math.min(100, puan / 9 * 100));
            const sayiMetni = veri.yolculuk_sayisi === 1 ? "1 yolculuk" : `${veri.yolculuk_sayisi} yolculuk`;
            return `<div class="bar-satiri"><div class="bar-hat">${guvenliMetin(veri.hat_kodu)}</div><div class="bar-zemin" title="${puan.toFixed(1)} / 9"><div class="bar-dolgu" style="width:${genislik}%;background:${yogunlukRengi(puan)}"></div></div><div class="bar-deger"><strong>${puan.toFixed(1)} / 9</strong> · ${yogunlukEtiketi(puan)}<br>${sayiMetni}</div></div>`;
        }).join("");
    }

    async function paylasimlariYukle() {
        const paylasimlar = await api("/api/paylasimlar");
        const alan = document.getElementById("paylasimlar");
        if (!paylasimlar.length) { alan.innerHTML = '<p class="bos">Henüz paylaşım yok. İlk fotoğrafı sen paylaş.</p>'; return; }
        alan.innerHTML = paylasimlar.map(p => `<article class="paylasim"><div class="meta"><span><strong>@${guvenliMetin(p.kullanici_adi)}</strong> · ${guvenliMetin(p.hat_kodu)}</span><time>${new Date(p.olusturulma_zamani).toLocaleString("tr-TR")}</time></div><img src="${encodeURI(p.fotograf_url)}" alt="${guvenliMetin(p.hat_kodu)} hattı paylaşımı" loading="lazy"><p class="aciklama">${guvenliMetin(p.aciklama)}</p></article>`).join("");
    }

    document.getElementById("paylasimFormu").addEventListener("submit", async event => {
        event.preventDefault();
        const dosya = document.getElementById("fotograf").files[0];
        if (dosya && dosya.size > 5 * 1024 * 1024) return mesajGoster("mesajPaylasim", "Fotoğraf 5 MB'dan küçük olmalı.", true);
        try {
            await api("/api/paylasim", { method: "POST", body: new FormData(event.target) });
            event.target.reset();
            mesajGoster("mesajPaylasim", "Fotoğraf paylaşıldı.");
            await paylasimlariYukle();
        } catch (error) { mesajGoster("mesajPaylasim", error.message, true); }
    });

    (async () => {
        try {
            const ben = await api("/api/auth/ben");
            document.getElementById("kullaniciAdi").textContent = `@${ben.kullanici_adi}`;
            await Promise.all([aktifYolculuguYukle(), yogunlukGrafiginiYukle(), paylasimlariYukle()]);
        } catch (error) { if (token) alert(error.message); }
    })();
</script>
</body>
</html>
