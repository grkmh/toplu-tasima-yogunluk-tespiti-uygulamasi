<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaRadar - Yolculuk Takip</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #2c3e50; }
        label { font-weight: bold; margin-top: 10px; display: block; color: #34495e; }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button.bitir-btn { background-color: #e74c3c; }
        button:hover { opacity: 0.9; }
        .hidden { display: none; }
        #mesajBasla, #mesajBitir { margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; }
        .basarili { background-color: #d4edda; color: #155724; }
        .hatali { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container" id="baslaEkrani">
    <h2>Minibüs/Otobüs Takip</h2>

    <label>Hat Kodu:</label>
    <input type="text" id="hatKodu" placeholder="Örn: 133GP">

    <label>Biniş Durağı:</label>
    <input type="text" id="durakAdi" placeholder="Örn: Kadıköy">

    <label>Şu Anki Yoğunluk (1-9):</label>
    <select id="yogunlukSkoru">
        <option value="2">Çok Rahat (Boş Koltuk Var)</option>
        <option value="5">Orta (Ayakta Yolcu Var)</option>
        <option value="8">Çok Yoğun (Adım Atacak Yer Yok)</option>
        <option value="9">Aşırı Yoğun (Nefes Alınmıyor)</option>
    </select>

    <button onclick="yolculukBaslat()">Yolculuğa Başla</button>
    <div id="mesajBasla" class="hidden"></div>
</div>

<div class="container hidden" id="bitirEkrani">
    <h2>Yolculuğu Bitir</h2>

    <label>İniş Durağı:</label>
    <input type="text" id="inisDuragi" placeholder="Örn: Pendik">

    <label>İnerkenki Yoğunluk (1-9):</label>
    <select id="inisYogunlukSkoru">
        <option value="2">Çok Rahat</option>
        <option value="5">Orta</option>
        <option value="8">Çok Yoğun</option>
        <option value="9">Aşırı Yoğun</option>
    </select>

    <button class="bitir-btn" onclick="yolculukBitir()">Araçtan İndim (Bitir)</button>
    <div id="mesajBitir" class="hidden"></div>
</div>

<script>
    let kullaniciId = localStorage.getItem("rotaKullaniciId");

    if (!kullaniciId) {
        kullaniciId = "user_" + crypto.randomUUID();
        localStorage.setItem("rotaKullaniciId", kullaniciId);
    }

    // Frontend ve API aynı uygulamadan sunulduğu için sabit adres gerekmiyor.
    const apiBaseUrl = "";

    function mesajGoster(elementId, mesaj, tip) {
        const element = document.getElementById(elementId);

        element.className = tip === "hata" ? "hatali" : "basarili";
        element.innerText = mesaj;
        element.style.display = "block";

        setTimeout(() => {
            element.style.display = "none";
        }, 3000);
    }

    async function apiIstegi(endpoint, payload) {
        const response = await fetch(`${apiBaseUrl}${endpoint}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        let data;

        try {
            data = await response.json();
        } catch {
            data = {};
        }

        if (!response.ok) {
            throw new Error(
                data.detail ||
                data.hata ||
                "İşlem gerçekleştirilemedi."
            );
        }

        return data;
    }

    async function yolculukBaslat() {
        const hatKodu = document
            .getElementById("hatKodu")
            .value
            .trim();

        const durakAdi = document
            .getElementById("durakAdi")
            .value
            .trim();

        if (!hatKodu || !durakAdi) {
            mesajGoster(
                "mesajBasla",
                "Lütfen tüm alanları doldurun.",
                "hata"
            );
            return;
        }

        const payload = {
            kullanici_id: kullaniciId,
            hat_kodu: hatKodu,
            durak_adi: durakAdi,
            yogunluk_skoru: Number(
                document.getElementById("yogunlukSkoru").value
            )
        };

        try {
            await apiIstegi(
                "/api/yolculuk/basla",
                payload
            );

            document
                .getElementById("baslaEkrani")
                .classList
                .add("hidden");

            document
                .getElementById("bitirEkrani")
                .classList
                .remove("hidden");

        } catch (error) {
            mesajGoster(
                "mesajBasla",
                error.message,
                "hata"
            );
        }
    }

    async function yolculukBitir() {
        const inisDuragi = document
            .getElementById("inisDuragi")
            .value
            .trim();

        if (!inisDuragi) {
            mesajGoster(
                "mesajBitir",
                "Lütfen iniş durağını girin.",
                "hata"
            );
            return;
        }

        const payload = {
            kullanici_id: kullaniciId,
            durak_adi: inisDuragi,
            yogunluk_skoru: Number(
                document.getElementById("inisYogunlukSkoru").value
            )
        };

        try {
            await apiIstegi(
                "/api/yolculuk/bitir",
                payload
            );

            document
                .getElementById("bitirEkrani")
                .classList
                .add("hidden");

            document
                .getElementById("baslaEkrani")
                .classList
                .remove("hidden");

            document.getElementById("inisDuragi").value = "";

            mesajGoster(
                "mesajBasla",
                "Yolculuğunuz başarıyla kaydedildi.",
                "basarili"
            );

        } catch (error) {
            mesajGoster(
                "mesajBitir",
                error.message,
                "hata"
            );
        }
    }
</script>
</body>
</html>
