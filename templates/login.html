<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Transit Yoğunluk</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .bottom-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; }
        .bottom-links a { color: #555; text-decoration: none; padding: 5px; border-radius: 4px; background: #eee; }
        .bottom-links a:hover { background: #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Giriş Yap</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="E-posta Adresi" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit">Giriş Yap</button>
        </form>
        <div class="bottom-links">
            <a href="register">Kayıt Ol</a>
            <a href="reset">Şifremi Unuttum</a>
        </div>
    </div>
    <script src="/static/auth.js"></script>
</body>
</html>
