<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - RotaRadar</title>
    <style>
        body { font-family: Arial,sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background:#f4f7f6; }
        .container { background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px #0002; width:min(340px,calc(100% - 40px)); text-align:center; }
        input,button { width:100%; padding:12px; margin:8px 0; border-radius:7px; box-sizing:border-box; font-size:16px; }
        input { border:1px solid #ccc; } button { border:0; color:white; background:#1769aa; font-weight:bold; cursor:pointer; }
        a { color:#1769aa; } #mesaj { color:#a32020; min-height:20px; }
    </style>
</head>
<body><div class="container">
    <h1>RotaRadar</h1><h2>Giriş Yap</h2>
    <form id="loginForm">
        <input id="kullanici_adi" autocomplete="username" placeholder="Kullanıcı adı" required>
        <input type="password" id="parola" autocomplete="current-password" placeholder="Parola" minlength="6" required>
        <button type="submit">Giriş Yap</button>
    </form>
    <div id="mesaj"></div><p><a href="/register">Hesap oluştur</a></p>
</div><script src="/static/auth.js"></script></body></html>
